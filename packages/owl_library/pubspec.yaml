version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.12.2
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  owl_core:
    path: ../owl_core
  owl_mod_studio:
