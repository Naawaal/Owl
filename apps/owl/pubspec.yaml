name: owl
description: "Owl Mobile Application"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  android_intent_plus: ^5.1.0
  package_info_plus: ^8.0.0
  http: ^1.2.2
  owl_core:
    path: ../../packages/owl_core
  owl_deck:
    path: ../../packages/owl_deck
  owl_library:
    path: ../../packages/owl_library
  owl_mod_studio:
    path: ../../packages/owl_mod_studio
  owl_skins:
    path: ../../packages/owl_skins

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/catalog.json
